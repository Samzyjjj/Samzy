<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMZY</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#020617;color:#fff}.hidden{display:none!important}.card{background:#0f172a;border-radius:16px;padding:12px;margin:10px;border:1px solid #1e293b;word-break:break-word}.header{background:#0f172a;padding:10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50}.pill{background:#1e293b;border-radius:20px;padding:6px 12px;font-size:12px;border:0;color:#fff;display:inline-block;margin:2px;cursor:pointer}.btn{background:#0ea5e9;color:#000;border:0;border-radius:20px;padding:10px 16px;font-weight:700;width:100%;margin-top:8px;cursor:pointer}.tabbar{background:#0f172a;position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #1e293b;z-index:100}.tab{font-size:22px;padding:6px 12px;border-radius:12px}.tab.active{background:#1e293b}textarea,input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px;color:#fff;margin-top:6px}#callScreen{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#callScreen.show{display:flex}video{width:100%;max-height:60vh;border-radius:12px;background:#000}.call-controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:16px}.call-btn{width:64px;height:64px;border-radius:50%;border:0;font-size:26px}.end{background:#ef4444;color:#fff}.accept{background:#22c55e;color:#fff}</style><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script></head><body><div id="authView"></div><div id="mainView" class="hidden"><div class="header"><b>SAMZY</b> <span id="mySamzy" class="pill"></span> <button class="pill" onclick="localStorage.clear();location.reload()">Logout</button></div><div id="storiesBar" class="card" style="display:flex;gap:8px;overflow-x:auto"></div><div id="feedView"></div><div id="friendsView" class="hidden"></div><div id="groupsView" class="hidden"></div><div id="marketView" class="hidden"></div><div id="watchView" class="hidden"></div><div id="savedView" class="hidden"></div><div id="profileView" class="hidden"></div><div style="height:80px"></div><div class="tabbar"><div class="tab active" onclick="switchTab('feed',this)">🏠</div><div class="tab" onclick="switchTab('friends',this)">👥</div><div class="tab" onclick="switchTab('groups',this)">👪</div><div class="tab" onclick="switchTab('market',this)">🛒</div><div class="tab" onclick="switchTab('watch',this)">▶️</div><div class="tab" onclick="switchTab('saved',this)">🔖</div><div class="tab" onclick="switchTab('profile',this)">👤</div></div></div><div id="callScreen"></div><script>const firebaseConfig={apiKey:"REPLACE_WITH_YOUR_KEY",authDomain:"samzy-worldwide.firebaseapp.com",databaseURL:"https://samzy-worldwide-default-rtdb.firebaseio.com",projectId:"samzy-worldwide",storageBucket:"samzy-worldwide.appspot.com",messagingSenderId:"123",appId:"1:123:web:abc"};let db=null,storage=null,useFirebase=false,currentUser=null,mySamzy="",postsCache=[],pc=null,localStream=null,activeChat=null;const FREE_TURN={urls:["stun:stun.l.google.com:19302","turn:openrelay.metered.ca:80"],username:"openrelayproject",credential:"openrelayproject"};try{firebase.initializeApp(firebaseConfig);db=firebase.database();storage=firebase.storage();useFirebase=true;}catch(e){}async function uploadBig(f){if(!f)return"";if(!useFirebase||!storage){return await new Promise(r=>{let rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);});}let ref=storage.ref('samzy/'+(mySamzy||'guest')+'/'+Date.now()+'_'+f.name);await ref.put(f);return await ref.getDownloadURL();}function encryptChat(t,k){try{return btoa(unescape(encodeURIComponent(t+"::"+k)));}catch{return t;}}function decryptChat(e){try{let d=decodeURIComponent(escape(atob(e)));return d.split("::")[0];}catch{return e;}}function parseFBUrl(t){if(!t)return null;let m=t.match(/(https?:\/\/(www\.)?(facebook\.com|fb\.watch|m\.facebook\.com)\/[^\s]+)/i);return m?m[0]:null;}function genSamzy(){return 'SAMZY-'+String(Date.now()).slice(-6).padStart(6,'0');}function handleAuth(){let n=document.getElementById('authName').value.trim();let a=document.getElementById('authAge').checked;if(!n){alert('Enter name');return;}if(!a){alert('Tick 13+');return;}let s=localStorage.getItem('samzy_user');if(s){currentUser=JSON.parse(s);mySamzy=currentUser.samzy;}else{mySamzy=genSamzy();currentUser={name:n,samzy:mySamzy,time:Date.now()};localStorage.setItem('samzy_user',JSON.stringify(currentUser));if(useFirebase)db.ref('users/'+mySamzy).set(currentUser);}document.getElementById('authView').classList.add('hidden');document.getElementById('mainView').classList.remove('hidden');document.getElementById('mySamzy').textContent=mySamzy;initPresence();listenCalls();loadAll();loadStories();}async function createPost(){let txtEl=document.getElementById('postText');let fileEl=document.getElementById('postPic');let txt=txtEl.value.trim();let file=fileEl.files[0];let media="";let isVideo=false;let fb=parseFBUrl(txt);if(file){media=await uploadBig(file);isVideo=file.type.startsWith('video');}if(!txt&&!media&&!fb){alert('Write or upload or FB link');return;}let p={name:currentUser.name,samzy:mySamzy,text:txt,media:media,isVideo:isVideo,fbLink:fb||"",likes:0,loves:0,time:Date.now()};if(useFirebase)db.ref('posts').push(p);else{postsCache.unshift({...p,key:Date.now()});renderPosts();}txtEl.value="";fileEl.value="";}function loadAll(){document.getElementById('feedView').innerHTML=`<div class="card"><textarea id="postText" placeholder="Type + paste FB link https://fb.watch/xxx OR upload 2GB pic/video"></textarea><input type="file" id="postPic" accept="image/*,video/*"><button class="btn" onclick="createPost()">Post Worldwide</button></div><div id="posts"></div>`;if(!useFirebase){renderPosts();return;}db.ref('posts').limitToLast(100).on('value',s=>{let l=[];s.forEach(c=>{let v=c.val();v.key=c.key;l.unshift(v);});postsCache=l;renderPosts();});}function renderPosts(){let d=document.getElementById('posts');if(!d)return;d.innerHTML=postsCache.map(p=>{let m="";if(p.fbLink)m+=`<div class="pill"><a href="${p.fbLink}" target="_blank" style="color:#0ea5e9">FB: ${p.fbLink.slice(0,40)}</a></div>`;if(p.media)m+=p.isVideo?`<video src="${p.media}" controls></video>`:`<img src="${p.media}" style="width:100%">`;return `<div class="card"><b>${p.name}</b> <span class="pill">${p.samzy}</span><p>${p.text||''}</p>${m}<div><button class="pill" onclick="reactPost('${p.key}','likes')">👍 ${p.likes||0}</button><button class="pill" onclick="reactPost('${p.key}','loves')">❤️ ${p.loves||0}</button><button class="pill" onclick="savePost('${p.key}')">🔖</button><button class="pill" onclick="sharePost('${p.key}')">↗️</button></div></div>`;}).join('');}function reactPost(k,t){if(useFirebase)db.ref('posts/'+k+'/'+t).transaction(c=>(c||0)+1);else{let p=postsCache.find(x=>x.key==k);if(p)p[t]=(p[t]||0)+1;renderPosts();}}function sharePost(k){let p=postsCache.find(x=>x.key==k);if(useFirebase)db.ref('posts').push({...p,text:'Shared: '+(p.text||''),time:Date.now()});else{postsCache.unshift({...p,time:Date.now(),key:Date.now()});renderPosts();}}function savePost(k){let p=postsCache.find(x=>x.key==k)||postsCache[0];let s=JSON.parse(localStorage.getItem('saved')||'[]');s.unshift(p);localStorage.setItem('saved',JSON.stringify(s));alert('Saved');}function initPresence(){if(!useFirebase)return;db.ref('presence/'+mySamzy).set({online:true,name:currentUser.name});db.ref('presence/'+mySamzy).onDisconnect().set({online:false});}function loadStories(){let b=document.getElementById('storiesBar');if(!b)return;b.innerHTML=`<div class="card" style="min-width:90px;text-align:center" onclick="let t=prompt('Story');if(t&&useFirebase)db.ref('stories').push({name:currentUser.name,samzy:mySamzy,text:t,time:Date.now()});">+ Story</div>`;if(!useFirebase)return;db.ref('stories').on('value',s=>{let h=`<div class="card" style="min-width:90px;text-align:center" onclick="let t=prompt('Story');if(t)db.ref('stories').push({name:currentUser.name,samzy:mySamzy,text:t,time:Date.now()});">+ Story</div>`;s.forEach(c=>{let v=c.val();if(Date.now()-v.time>86400000)return;h+=`<div class="card" style="min-width:90px">${v.name}<br>${v.text||''}</div>`;});b.innerHTML=h;});}function listenCalls(){if(!useFirebase)return;db.ref('calls/'+mySamzy).on('value',s=>{let v=s.val();if(v&&v.type==='offer')showIncoming(v);});}function showIncoming(o){let sc=document.getElementById('callScreen');sc.classList.add('show');sc.innerHTML=`<div style="margin:auto;text-align:center"><h2>${o.from} calling</h2><div class="call-controls"><button class="call-btn accept" onclick="acceptCall()">✓</button><button class="call-btn end" onclick="endCall()">✕</button></div></div>`;}async function startCall(target){if(!target)target=prompt('Enter SAMZY- number');if(!target)return;pc=new RTCPeerConnection({iceServers:[FREE_TURN]});try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});localStream.getTracks().forEach(tr=>pc.addTrack(tr,localStream));}catch(e){alert('Need camera');return;}pc.onicecandidate=e=>{if(e.candidate&&useFirebase)db.ref('calls/'+target+'/candidates').push(e.candidate);};let offer=await pc.createOffer();await pc.setLocalDescription(offer);if(useFirebase)db.ref('calls/'+target).set({type:'offer',from:mySamzy,sdp:offer});let sc=document.getElementById('callScreen');sc.classList.add('show');sc.innerHTML=`<p>Calling ${target}</p><button class="call-btn end" onclick="endCall()">End</button><video id="localVideo" autoplay muted playsinline style="width:100px;position:absolute;top:10px;right:10px"></video><video id="remoteVideo" autoplay playsinline style="width:100%;height:60vh"></video>`;document.getElementById('localVideo').srcObject=localStream;}async function acceptCall(){let snap=await db.ref('calls/'+mySamzy).once('value');let offer=snap.val();pc=new RTCPeerConnection({iceServers:[FREE_TURN]});localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});localStream.getTracks().forEach(tr=>pc.addTrack(tr,localStream));await pc.setRemoteDescription(new RTCSessionDescription(offer.sdp));let ans=await pc.createAnswer();await pc.setLocalDescription(ans);if(useFirebase)db.ref('calls/'+offer.from).set({type:'answer',from:mySamzy,sdp:ans});let sc=document.getElementById('callScreen');sc.classList.add('show');sc.innerHTML=`<video id="localVideo" autoplay muted playsinline style="width:100px;position:absolute;top:10px;right:10px"></video><video id="remoteVideo" autoplay playsinline style="width:100%;height:70vh"></video><div class="call-controls"><button class="call-btn end" onclick="endCall()">✕</button></div>`;document.getElementById('localVideo').srcObject=localStream;}function endCall(){if(pc){pc.close();pc=null;}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}document.getElementById('callScreen').classList.remove('show');document.getElementById('callScreen').innerHTML="";if(useFirebase)db.ref('calls/'+mySamzy).remove();}function switchTab(t,el){document.querySelectorAll('#feedView,#friendsView,#groupsView,#marketView,#watchView,#savedView,#profileView').forEach(v=>v.classList.add('hidden'));let tg=document.getElementById(t+'View');if(tg){tg.classList.remove('hidden');if(t!=='feed')tg.innerHTML=`<div class="card"><h3>${t}</h3><div id="${t}List"></div></div>`;if(t==='friends')loadFriends();if(t==='market')loadMarket();if(t==='watch')loadWatch();if(t==='saved')loadSaved();}document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');}function loadFriends(){if(!useFirebase){document.getElementById('friendsList').innerHTML='Need Firebase';return;}db.ref('presence').on('value',s=>{let h="";s.forEach(c=>{let v=c.val();h+=`<div class="pill">${v.name} ${c.key} <button class="pill" onclick="startCall('${c.key}')">Call</button></div>`;});document.getElementById('friendsList').innerHTML=h;});}function loadMarket(){document.getElementById('marketList').innerHTML='<input id="mItem" placeholder="Item + price"><button class="pill" onclick="if(useFirebase)db.ref(`market`).push({item:document.getElementById(`mItem`).value,owner:mySamzy})">Post Market</button>';}function loadWatch(){let h=postsCache.filter(p=>p.media||p.fbLink).map(p=>`<div class="card">${p.fbLink?`<a href="${p.fbLink}" target="_blank">${p.fbLink}</a>`:''}${p.media?(p.isVideo?`<video src="${p.media}" controls></video>`:`<img src="${p.media}" style="width:100%">`):''}</div>`).join('');document.getElementById('watchList').innerHTML=h||'No videos';}function loadSaved(){let sv=JSON.parse(localStorage.getItem('saved')||'[]');document.getElementById('savedList').innerHTML=sv.map(p=>`<div class="card">${p.text||''}</div>`).join('')||'Empty';}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('authView').innerHTML=`<div class="card" style="margin-top:60px;text-align:center"><h2>SAMZY Worldwide</h2><p>Registration + SAMZY- forever</p><input id="authName" placeholder="Name"><div style="margin:10px 0"><input type="checkbox" id="authAge" style="width:auto"> I am 13+</div><button class="btn" onclick="handleAuth()">Enter</button></div>`;let saved=localStorage.getItem('samzy_user');if(saved){currentUser=JSON.parse(saved);mySamzy=currentUser.samzy;document.getElementById('authView').classList.add('hidden');document.getElementById('mainView').classList.remove('hidden');setTimeout(()=>{document.getElementById('mySamzy').textContent=mySamzy;initPresence();loadAll();loadStories();listenCalls();},600);}});</script></body></html>
