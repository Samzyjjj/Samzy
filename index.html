<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samzy - Connect Worldwide</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}body{background:#f0f2f5}.hidden{display:none!important}header{background:#fff;position:sticky;top:0;z-index:100;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.logo{color:#0866ff;font-weight:900;font-size:28px}.search-box{flex:1;background:#f0f2f5;border-radius:20px;padding:8px 12px;display:flex;gap:6px;max-width:400px}.search-box input{border:none;background:transparent;outline:none;width:100%}.icon{width:36px;height:36px;border-radius:50%;background:#e4e6eb;display:flex;align-items:center;justify-content:center;cursor:pointer}.nav{display:flex;gap:4px;background:#fff;padding:6px;position:sticky;top:53px;z-index:99;justify-content:space-around}.nav button{flex:1;border:none;background:transparent;padding:10px;font-weight:600;color:#65676b;border-bottom:3px solid transparent;cursor:pointer}.nav button.active{color:#0866ff;border-color:#0866ff}.container{max-width:600px;margin:auto;padding:8px}.card{background:#fff;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.1)}.stories{display:flex;gap:8px;overflow:auto;padding:6px 0}.story{min-width:110px;height:170px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;background:#ddd;flex-shrink:0}.story img{width:100%;height:100%;object-fit:cover}.story .label{position:absolute;bottom:6px;left:6px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}.story.create{background:#fff;border:1px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:end;padding-bottom:10px}.composer{display:flex;gap:10px;align-items:center}.composer img{width:40px;height:40px;border-radius:50%}.composer input{flex:1;background:#f0f2f5;border:none;padding:10px 14px;border-radius:20px;cursor:pointer}.post-head{display:flex;gap:10px;align-items:center}.post-head img{width:40px;height:40px;border-radius:50%}.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px}.actions button{border:none;background:none;font-weight:600;color:#65676b;padding:6px;cursor:pointer;flex:1}.user-row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}.user-row:hover{background:#f0f2f5}.user-row img{width:50px;height:50px;border-radius:50%}.btn{padding:8px 16px;border-radius:6px;border:none;font-weight:700;cursor:pointer}.btn-blue{background:#0866ff;color:#fff}.btn-gray{background:#e4e6eb}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:420px;border-radius:12px;padding:20px;max-height:90vh;overflow:auto}.modal-box input,.modal-box textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0;outline:none}.chat-box{height:300px;overflow:auto;background:#f0f2f5;border-radius:8px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:6px}.msg{padding:8px 12px;border-radius:18px;max-width:70%;font-size:14px}.msg.me{align-self:flex-end;background:#0866ff;color:#fff}.msg.them{align-self:flex-start;background:#fff}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:999}.product{display:flex;gap:10px;border:1px solid #eee;border-radius:8px;padding:8px;margin:8px 0}.product img{width:80px;height:80px;border-radius:8px;object-fit:cover}.auth{max-width:400px;margin:40px auto;padding:20px}.auth h1{color:#0866ff;font-size:42px;font-weight:900;text-align:center;margin-bottom:20px}</style></head><body><div id="authPage" class="auth"><h1>samzy</h1><div class="card"><h3>Create new account</h3><input id="regName" placeholder="Full Name"><input id="regEmail" placeholder="Email"><input id="regPass" type="password" placeholder="Password"><button class="btn btn-blue" style="width:100%;margin-top:10px" onclick="register()">Sign Up</button><p style="text-align:center;margin:12px 0;color:#65676b">or</p><input id="loginEmail" placeholder="Email for login"><input id="loginPass" type="password" placeholder="Password"><button class="btn btn-gray" style="width:100%" onclick="login()">Log In</button></div></div><div id="app" class="hidden"><header><div class="logo" onclick="switchTab('feed')">samzy</div><div class="search-box"><span>🔍</span><input id="search" placeholder="Search friends, marketplace..." oninput="doSearch(this.value)"></div><div class="icon" onclick="openComposer()">+</div><div class="icon" onclick="switchTab('chat')">💬</div><div class="icon" onclick="logout()">👤</div></header><div class="nav"><button id="tab-feed" class="active" onclick="switchTab('feed')">🏠 Feed</button><button id="tab-friends" onclick="switchTab('friends')">👥 Friends</button><button id="tab-market" onclick="switchTab('market')">🛒 Market</button><button id="tab-chat" onclick="switchTab('chat')">💬 Chat</button></div><div class="container"><div id="view-feed"><div class="stories" id="storiesList"></div><div class="card composer"><img id="myAvatar"><input readonly placeholder="What's on your mind?" onclick="openComposer()"><span onclick="openComposer()">🖼️</span></div><div id="feed"></div></div><div id="view-friends" class="hidden"><div class="card"><h3>People You May Know</h3><div id="friendsList"></div></div></div><div id="view-market" class="hidden"><div class="card"><h3>Marketplace</h3><input id="marketTitle" placeholder="What are you selling?"><input id="marketPrice" placeholder="Price e.g. 50000"><input id="marketImg" placeholder="Image URL"><button class="btn btn-blue" style="width:100%;margin-top:6px" onclick="addProduct()">Post for Sale</button></div><div id="marketList"></div></div><div id="view-chat" class="hidden"><div class="card"><h3>Chats</h3><div id="chatUsers"></div></div></div><div id="view-search" class="hidden"><div class="card"><h3 id="searchTitle">Search</h3><div id="searchResults"></div></div></div></div></div><div class="modal" id="composerModal" onclick="if(event.target==this)closeModals()"><div class="modal-box"><h3>Create Post</h3><textarea id="postText" rows="4" placeholder="What's on your mind?"></textarea><input id="postImg" placeholder="Image URL (optional)"><button class="btn btn-blue" style="width:100%;margin-top:8px" onclick="createPost()">Post</button><button class="btn btn-gray" style="width:100%;margin-top:6px" onclick="closeModals()">Cancel</button></div></div><div class="modal" id="storyModal" onclick="if(event.target==this)closeModals()"><div class="modal-box"><h3>Create Story</h3><input id="storyImg" placeholder="Image URL"><button class="btn btn-blue" style="width:100%" onclick="createStory()">Add to Story</button><button class="btn btn-gray" style="width:100%;margin-top:6px" onclick="closeModals()">Cancel</button></div></div><div class="modal" id="chatModal" onclick="if(event.target==this)closeModals()"><div class="modal-box"><h3 id="chatWith">Chat</h3><div class="chat-box" id="chatBox"></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Type message..." style="flex:1"><button class="btn btn-blue" onclick="sendMsg()">Send</button></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-gray" style="flex:1" onclick="voiceCall()">📞 Voice Call</button><button class="btn btn-gray" style="flex:1" onclick="videoCall()">📹 Video Call</button></div><button class="btn btn-gray" style="width:100%;margin-top:6px" onclick="closeModals()">Close</button></div></div><div class="modal" id="callModal"><div class="modal-box" style="text-align:center"><h2 id="callStatus">Calling...</h2><img id="callAvatar" src="" style="width:100px;height:100px;border-radius:50%;margin:12px auto;display:block"><p id="callName"></p><video id="videoEl" autoplay muted playsinline style="width:100%;border-radius:12px;display:none;background:#000;height:200px"></video><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn" style="background:red;color:#fff" onclick="endCall()">End Call</button></div></div></div><div id="toast"></div><script>let currentUser=JSON.parse(localStorage.getItem('samzy_user')||'null');let users=JSON.parse(localStorage.getItem('samzy_users')||'[]');let posts=JSON.parse(localStorage.getItem('samzy_posts')||'[]');let stories=JSON.parse(localStorage.getItem('samzy_stories')||'[]');let products=JSON.parse(localStorage.getItem('samzy_products')||'[]');let chats=JSON.parse(localStorage.getItem('samzy_chats')||'{}');let currentChat=null;const defaultUsers=[{name:"Sarah Johnson",email:"sarah@demo.com",avatar:"https://randomuser.me/api/portraits/women/44.jpg"},{name:"Michael Chen",email:"michael@demo.com",avatar:"https://randomuser.me/api/portraits/men/32.jpg"},{name:"Aisha Bello",email:"aisha@demo.com",avatar:"https://randomuser.me/api/portraits/women/68.jpg"},{name:"John Doe",email:"john@demo.com",avatar:"https://randomuser.me/api/portraits/men/75.jpg"}];function saveAll(){localStorage.setItem('samzy_users',JSON.stringify(users));localStorage.setItem('samzy_posts',JSON.stringify(posts));localStorage.setItem('samzy_stories',JSON.stringify(stories));localStorage.setItem('samzy_products',JSON.stringify(products));localStorage.setItem('samzy_chats',JSON.stringify(chats))}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}function checkAuth(){if(currentUser){document.getElementById('authPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('myAvatar').src=currentUser.avatar;init()}}checkAuth();function register(){let name=document.getElementById('regName').value.trim();let email=document.getElementById('regEmail').value.trim().toLowerCase();let pass=document.getElementById('regPass').value;if(!name||!email||!pass){toast('Fill all fields');return}if(users.find(u=>u.email===email)){toast('Email exists, login');return}let avatar=`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0866ff&color=fff`;let u={name,email,pass,avatar};users.push(u);currentUser=u;localStorage.setItem('samzy_user',JSON.stringify(u));saveAll();checkAuth();toast('Welcome '+name)}function login(){let email=document.getElementById('loginEmail').value.trim().toLowerCase();let pass=document.getElementById('loginPass').value;let u=users.find(x=>x.email===email&&x.pass===pass);if(!u){toast('Wrong email or password');return}currentUser=u;localStorage.setItem('samzy_user',JSON.stringify(u));checkAuth();toast('Welcome back '+u.name)}function logout(){localStorage.removeItem('samzy_user');location.reload()}function init(){renderStories();renderFeed();renderFriends();renderMarket();renderChatUsers()}function switchTab(t){['feed','friends','market','chat','search'].forEach(x=>{let el=document.getElementById('view-'+x);if(el)el.classList.add('hidden');let btn=document.getElementById('tab-'+x);if(btn)btn.classList.remove('active')});document.getElementById('view-'+t).classList.remove('hidden');let b=document.getElementById('tab-'+t);if(b)b.classList.add('active');if(t==='feed')renderFeed()}function openComposer(){document.getElementById('composerModal').classList.add('show')}function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}function createPost(){let text=document.getElementById('postText').value.trim();let img=document.getElementById('postImg').value.trim();if(!text){toast('Write something');return}posts.unshift({id:Date.now(),name:currentUser.name,avatar:currentUser.avatar,text,img,time:'Just now',likes:0,liked:false});saveAll();closeModals();document.getElementById('postText').value='';document.getElementById('postImg').value='';renderFeed();toast('Posted!')}function renderFeed(){let feed=document.getElementById('feed');feed.innerHTML='';posts.forEach(p=>{let div=document.createElement('div');div.className='card';div.innerHTML=`<div class="post-head"><img src="${p.avatar}"><div><b>${p.name}</b><div style="font-size:12px;color:#65676b">${p.time}</div></div></div><p style="margin:10px 0">${p.text}</p>${p.img?`<img src="${p.img}" style="width:100%;border-radius:10px">`:''}<div class="actions"><button onclick="likePost(${p.id},this)">${p.liked?'👍 Liked':'👍 Like'} ${p.likes||''}</button><button onclick="commentPost(${p.id})">💬 Comment</button><button onclick="sharePost()">↗️ Share</button></div>`;feed.appendChild(div)})}function likePost(id,btn){let p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;saveAll();renderFeed()}function commentPost(id){let c=prompt('Comment:');if(c)toast('Comment: '+c)}function sharePost(){toast('Link copied!')}function renderStories(){let el=document.getElementById('storiesList');el.innerHTML=`<div class="story create" onclick="openStory()"><div style="height:60%;background:#f0f2f5;display:flex;align-items:center;justify-content:center"><div style="background:#0866ff;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:40px">+</div></div><div style="padding:10px;text-align:center;font-weight:600;font-size:13px">Create Story</div></div>`;stories.forEach(s=>{let d=document.createElement('div');d.className='story';d.onclick=()=>toast('Playing '+s.name+' story');d.innerHTML=`<img src="${s.img}"><div class="label">${s.name}</div>`;el.appendChild(d)});[...defaultUsers].forEach(u=>{let d=document.createElement('div');d.className='story';d.onclick=()=>toast('Playing '+u.name+' story');d.innerHTML=`<img src="${u.avatar}"><div class="label">${u.name.split(' ')[0]}</div>`;el.appendChild(d)})}function openStory(){document.getElementById('storyModal').classList.add('show')}function createStory(){let img=document.getElementById('storyImg').value.trim()||currentUser.avatar;stories.unshift({name:currentUser.name,img});saveAll();closeModals();renderStories();toast('Story added!')}function renderFriends(){let list=document.getElementById('friendsList');list.innerHTML='';let all=[...users.filter(u=>u.email!==currentUser.email),...defaultUsers];all.forEach(u=>{let div=document.createElement('div');div.className='user-row';div.innerHTML=`<img src="${u.avatar}"><div style="flex:1"><b>${u.name}</b><div style="font-size:12px;color:#65676b">${u.email}</div></div><button class="btn btn-blue" onclick="startChat('${u.email}','${u.name}','${u.avatar}')">Message</button> <button class="btn btn-gray" onclick="addFriend('${u.name}')">+ Add</button>`;list.appendChild(div)})}function addFriend(name){toast('Friend request sent to '+name+'!')}function doSearch(q){if(!q){switchTab('feed');return}let all=[...users,...defaultUsers,...products.map(p=>({name:p.title}))];let res=all.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));document.getElementById('view-search').classList.remove('hidden');['feed','friends','market','chat'].forEach(x=>document.getElementById('view-'+x).classList.add('hidden'));document.getElementById('searchTitle').textContent=`Search for "${q}" - ${res.length} results`;let box=document.getElementById('searchResults');box.innerHTML='';if(res.length===0)box.innerHTML='<p>No results</p>';res.forEach(r=>{let div=document.createElement('div');div.className='user-row';div.innerHTML=`<img src="${r.avatar||'https://ui-avatars.com/api/?name='+r.name}"><div><b>${r.name}</b><div style="font-size:12px">${r.email||''}</div></div><button class="btn btn-blue" onclick="startChat('${r.email||''}','${r.name}','${r.avatar||''}')">Chat</button>`;box.appendChild(div)})}function renderMarket(){let list=document.getElementById('marketList');list.innerHTML='';products.forEach(p=>{let d=document.createElement('div');d.className='card product';d.innerHTML=`<img src="${p.img}"><div style="flex:1"><b>${p.title}</b><div style="color:#0866ff;font-weight:700">₦${p.price}</div><div style="font-size:12px">Seller: ${p.seller}</div><button class="btn btn-blue" style="margin-top:6px" onclick="buyProduct('${p.title}')">Chat Seller</button></div>`;list.appendChild(d)})}function addProduct(){let t=document.getElementById('marketTitle').value.trim();let pr=document.getElementById('marketPrice').value.trim();let im=document.getElementById('marketImg').value.trim()||'https://via.placeholder.com/150';if(!t||!pr){toast('Enter title and price');return}products.unshift({title:t,price:pr,img:im,seller:currentUser.name});saveAll();renderMarket();toast('Product posted!');document.getElementById('marketTitle').value='';document.getElementById('marketPrice').value='';document.getElementById('marketImg').value=''}function buyProduct(title){toast('Contacting seller of '+title+'...');switchTab('chat')}function renderChatUsers(){let box=document.getElementById('chatUsers');box.innerHTML='';let all=[...users.filter(u=>u.email!==currentUser.email),...defaultUsers];all.forEach(u=>{let d=document.createElement('div');d.className='user-row';d.onclick=()=>startChat(u.email,u.name,u.avatar);d.innerHTML=`<img src="${u.avatar}"><div style="flex:1"><b>${u.name}</b><div style="font-size:12px;color:#65676b">Tap to chat, voice & video call</div></div><span>📞 📹</span>`;box.appendChild(d)})}function startChat(email,name,avatar){currentChat=email||name;document.getElementById('chatWith').textContent='Chat with '+name;document.getElementById('chatModal').classList.add('show');document.getElementById('callName').textContent=name;document.getElementById('callAvatar').src=avatar||'';renderMessages()}function renderMessages(){let box=document.getElementById('chatBox');box.innerHTML='';let msgs=chats[currentChat]||[];msgs.forEach(m=>{let div=document.createElement('div');div.className='msg '+(m.me?'me':'them');div.textContent=m.text;box.appendChild(div)});box.scrollTop=box.scrollHeight}function sendMsg(){let inp=document.getElementById('chatInput');let txt=inp.value.trim();if(!txt)return;if(!chats[currentChat])chats[currentChat]=[];chats[currentChat].push({text:txt,me:true});setTimeout(()=>{chats[currentChat].push({text:'Thanks! Saw your message on Samzy 🌍',me:false});saveAll();renderMessages()},800);saveAll();inp.value='';renderMessages()}function voiceCall(){document.getElementById('callModal').classList.add('show');document.getElementById('callStatus').textContent='Voice Calling...';document.getElementById('videoEl').style.display='none';toast('Voice call started')}function videoCall(){document.getElementById('callModal').classList.add('show');document.getElementById('callStatus').textContent='Video Calling...';document.getElementById('videoEl').style.display='block';navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{document.getElementById('videoEl').srcObject=s}).catch(()=>{toast('Allow camera')})}function endCall(){document.getElementById('callModal').classList.remove('show');let v=document.getElementById('videoEl');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}toast('Call ended')}
</script></body></html>
