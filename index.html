ollection("messages").orderBy("time").onSnapshot(q=>{let b=document.getElementById('m');b.innerHTML='';q.forEach(doc=>{let k=doc.data();b.innerHTML+=`<div class="msg ${k.me?'me':''}">${k.text}</div>`});b.scrollTop=b.scrollHeight})}function s(){let a=document.getElementById('i');let t=a.value.trim();if(!t||c===null)return;db.collection("chats").doc("chat_"+c).collection("messages").add({text:t,me:true,time:Date.now()});a.value=''}</script></body></html>
