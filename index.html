<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMZY Worldwide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#020617;color:#fff}
.hidden{display:none!important}
.card{background:#0f172a;border-radius:16px;padding:16px;margin:12px;border:1px solid #1e293b}
.btn{background:#0ea5e9;color:#000;border:0;border-radius:20px;padding:12px;width:100%;font-weight:700;margin-top:10px}
input,textarea{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;color:#fff;margin-top:8px}
.pill{background:#1e293b;border-radius:20px;padding:6px 12px;display:inline-block;margin:4px}
</style>
</head>
<body>
<div id="authView" class="card" style="margin-top:80px;text-align:center">
<h2>SAMZY Worldwide</h2>
<p>Registration + SAMZY- number forever</p>
<input id="authName" placeholder="Your Name">
<div style="margin:12px 0"><input type="checkbox" id="authAge" style="width:auto"> I am 13+</div>
<button class="btn" onclick="handleAuth()">Enter SAMZY</button>
</div>
<div id="mainView" class="hidden">
<div class="card"><b id="mySamzy"></b> <button class="pill" onclick="localStorage.clear();location.reload()">Logout</button></div>
<div class="card"><textarea id="postText" placeholder="Write + paste FB link https://fb.watch/xxx"></textarea><input type="file" id="postPic" accept="image/*,video/*"><button class="btn" onclick="createPost()">Post</button></div>
<div id="posts"></div>
</div>
<script>
let currentUser=null,mySamzy="",posts=[];
function genSamzy(){return 'SAMZY-'+String(Date.now()).slice(-6).padStart(6,'0');}
function handleAuth(){
let n=document.getElementById('authName').value.trim();
if(!n){alert('Name');return;}
if(!document.getElementById('authAge').checked){alert('Tick 13+');return;}
let s=localStorage.getItem('samzy_user');
if(s){currentUser=JSON.parse(s);mySamzy=currentUser.samzy;}
else{mySamzy=genSamzy();currentUser={name:n,samzy:mySamzy};localStorage.setItem('samzy_user',JSON.stringify(currentUser));}
document.getElementById('authView').classList.add('hidden');
document.getElementById('mainView').classList.remove('hidden');
document.getElementById('mySamzy').textContent=mySamzy+' - '+currentUser.name;
loadPosts();
}
function createPost(){
let txt=document.getElementById('postText').value.trim();
let file=document.getElementById('postPic').files[0];
if(!txt && !file){alert('Write something');return;}
let url=""; if(file) url=URL.createObjectURL(file);
posts.unshift({name:currentUser.name,samzy:mySamzy,text:txt,media:url,isVideo:file&&file.type.startsWith('video'),time:Date.now()});
document.getElementById('postText').value=""; document.getElementById('postPic').value="";
render();
}
function loadPosts(){render();}
function render(){
let d=document.getElementById('posts');
d.innerHTML=posts.map(p=>`<div class="card"><b>${p.name}</b> <span class="pill">${p.samzy}</span><p>${p.text}</p>${p.media?(p.isVideo?`<video src="${p.media}" controls style="width:100%"></video>`:`<img src="${p.media}" style="width:100%">`):''}</div>`).join('');
}
let saved=localStorage.getItem('samzy_user');
if(saved){
currentUser=JSON.parse(saved);mySamzy=currentUser.samzy;
document.getElementById('authView').classList.add('hidden');
document.getElementById('mainView').classList.remove('hidden');
setTimeout(()=>{document.getElementById('mySamzy').textContent=mySamzy+' - '+currentUser.name;},500);
}
</script>
</body>
</html>
