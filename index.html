<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samzy - Connect & Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a14;color:#fff;min-height:100vh}
header{background:#121226;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
.logo{font-weight:800;font-size:22px;letter-spacing:1px}
.logo span{color:#7c3aed}
.btn{background:#7c3aed;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer}
.container{display:grid;grid-template-columns:300px 1fr;max-width:1200px;margin:0 auto;height:calc(100vh - 58px)}
.sidebar{background:#11112a;border-right:1px solid #222;padding:16px;overflow-y:auto}
.search{width:100%;background:#1c1c3a;border:1px solid #333;border-radius:999px;padding:10px 14px;color:#fff;outline:none;margin-bottom:14px}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;transition:.2s}
.user-card:hover{background:#1c1c3a}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:800}
.user-info b{display:block;font-size:14px}
.user-info small{color:#aaa;font-size:12px}
.chat-area{display:flex;flex-direction:column;background:#0a0a14}
.chat-header{padding:16px 20px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:#7c3aed;color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#1e1e3a;border-bottom-left-radius:4px}
.input-area{padding:14px;border-top:1px solid #222;display:flex;gap:10px}
.input-area input{flex:1;background:#1c1c3a;border:1px solid #333;border-radius:999px;padding:12px 16px;color:#fff;outline:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#888;text-align:center;padding:40px}
.empty h2{color:#fff;margin-bottom:8px}
@media(max-width:768px){.container{grid-template-columns:1fr}.sidebar{display:block}.chat-area{display:none}.container.chat-open .sidebar{display:none}.container.chat-open .chat-area{display:flex}}
.badge{background:#7c3aed;padding:2px 8px;border-radius:999px;font-size:10px;margin-left:auto}
</style>
</head>
<body>
<header>
<div class="logo">SAMZY<span>.io</span></div>
<button class="btn" onclick="shareApp()">Share App</button>
</header>
<div class="container" id="app">
<div class="sidebar">
<input class="search" id="search" placeholder="Search friends..." oninput="filterUsers()">
<div id="userList"></div>
<div style="margin-top:20px;padding:12px;background:#1c1c3a;border-radius:12px">
<small style="color:#aaa">Your link:</small>
<div style="font-size:11px;word-break:break-all;margin-top:4px;color:#7c3aed">https://samzyjjj.github.io/Samzy/</div>
<small style="color:#aaa;margin-top:8px;display:block">Anyone with this link can open Samzy!</small>
</div>
</div>
<div class="chat-area" id="chatArea">
<div class="empty" id="empty">
<h2>Welcome to Samzy 💜</h2>
<p>Select a friend to start chatting.<br>Find new people. Make friends.</p>
<p style="margin-top:16px;font-size:12px;color:#555">Built by Samzyjjj • Lagos, NG</p>
</div>
<div id="activeChat" style="display:none;flex-direction:column;height:100%">
<div class="chat-header">
<div class="avatar" id="chatAvatar">A</div>
<div><b id="chatName">Alex</b><small id="chatStatus" style="color:#22c55e;display:block;font-size:12px">Online • Samzy user</small></div>
<button class="btn" style="margin-left:auto;padding:6px 12px;font-size:12px" onclick="closeChat()">Back</button>
</div>
<div class="messages" id="messages"></div>
<div class="input-area">
<input id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
<button class="btn" onclick="sendMsg()">Send</button>
</div>
</div>
</div>
</div>
<script>
const users=[
{name:"Amara", city:"Lagos, NG", last:"Hey! Welcome to Samzy 💜", letter:"A", online:true},
{name:"David King", city:"Abuja, NG", last:"Yo, you on Samzy?", letter:"D", online:true},
{name:"Sophia", city:"London, UK", last:"Love the app design!", letter:"S", online:false},
{name:"Emeka", city:"Enugu, NG", last:"Let's link up!", letter:"E", online:true},
{name:"Zara", city:"Accra, GH", last:"Samzy is fire 🔥", letter:"Z", online:true},
{name:"Tunde", city:"Lagos, NG", last:"Are you coming today?", letter:"T", online:false},
{name:"Blessing", city:"Port Harcourt, NG", last:"Seen your profile", letter:"B", online:true}
];
let activeUser=null;
function renderUsers(list=users){
document.getElementById('userList').innerHTML=list.map((u,i)=>`
<div class="user-card" onclick="openChat(${users.indexOf(u)})">
<div class="avatar">${u.letter}</div>
<div class="user-info"><b>${u.name}</b><small>${u.last}</small></div>
${u.online?'<span class="badge">online</span>':''}
</div>`).join('');
}
function filterUsers(){
const q=document.getElementById('search').value.toLowerCase();
renderUsers(users.filter(u=>u.name.toLowerCase().includes(q)));
}
function openChat(i){
activeUser=i;
document.getElementById('empty').style.display='none';
document.getElementById('activeChat').style.display='flex';
document.getElementById('app').classList.add('chat-open');
const u=users[i];
document.getElementById('chatName').textContent=u.name;
document.getElementById('chatAvatar').textContent=u.letter;
document.getElementById('chatStatus').textContent=u.city+' • '+(u.online?'Online':'Offline');
loadMsgs();
}
function closeChat(){
document.getElementById('app').classList.remove('chat-open');
document.getElementById('activeChat').style.display='none';
document.getElementById('empty').style.display='flex';
}
function getKey(){return 'samzy_chat_'+activeUser;}
function loadMsgs(){
const div=document.getElementById('messages');
const saved=JSON.parse(localStorage.getItem(getKey())||'[]');
if(saved.length===0){
div.innerHTML=`<div class="msg them">Hi! I'm ${users[activeUser].name} 👋 Welcome to Samzy!</div><div class="msg them">This is a demo chat. Messages save on your phone.</div>`;
}else{
div.innerHTML=saved.map(m=>`<div class="msg ${m.me?'me':'them'}">${m.text}</div>`).join('');
}
div.scrollTop=div.scrollHeight;
}
function sendMsg(){
const input=document.getElementById('msgInput');
const text=input.value.trim();
if(!text||activeUser===null)return;
const key=getKey();
const arr=JSON.parse(localStorage.getItem(key)||'[]');
arr.push({text,me:true});
localStorage.setItem(key,JSON.stringify(arr));
input.value='';
loadMsgs();
setTimeout(()=>{
const arr2=JSON.parse(localStorage.getItem(key)||'[]');
const replies=["Nice! 😊","Haha for real","Samzy is going to be big! 🚀","Wagwan, you dey Lagos?","Let's chat more later!"];
arr2.push({text:replies[Math.floor(Math.random()*replies.length)],me:false});
localStorage.setItem(key,JSON.stringify(arr2));
loadMsgs();
},800);
}
function shareApp(){
if(navigator.share){navigator.share({title:'Samzy',text:'Join me on Samzy - Find & Chat!',url:'https://samzyjjj.github.io/Samzy/'});}else{
navigator.clipboard.writeText('https://samzyjjj.github.io/Samzy/');
alert('Link copied! https://samzyjjj.github.io/Samzy/');
}
}
renderUsers();
</script>
</body>
</html>
